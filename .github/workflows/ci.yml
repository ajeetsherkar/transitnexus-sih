name: TransitNexus CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run linter
        run: |
          flake8 backend scripts --max-line-length=88 --count --statistics

      - name: FastAPI smoke test
        run: |
          python -c "from backend.main import app; assert app is not None; print('FastAPI app initialized successfully')"
